name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk Impostor.apk

      - name: Publicar no Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Impostor v1.${{ github.run_number }}
          body: Baixe o Impostor.apk abaixo e instale no celular.
          files: Impostor.apk
