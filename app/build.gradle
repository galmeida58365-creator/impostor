plugins { id 'com.android.application' }

android {
    namespace 'com.guilherme.impostor'
    compileSdk 34
    defaultConfig {
        applicationId 'com.guilherme.impostor'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        fixo {
            storeFile file('impostor.keystore')
            storePassword 'impostor123'
            keyAlias 'impostor'
            keyPassword 'impostor123'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixo
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
